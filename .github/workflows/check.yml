name: Check local kernel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feya
          POSTGRES_PASSWORD: feya-local
          POSTGRES_DB: feya
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U feya -d feya"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run alembic upgrade head
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/feya
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/console
